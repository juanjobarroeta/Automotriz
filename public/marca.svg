<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Automotriz PRO">
  <!--
    La marca: una «a» de caja baja donde el bombo ES la llanta.

    Antes fue una «A» de caja alta con el travesaño pintado como raya de
    carril. Se cambió porque la raya era decoración, no significado: a 32px
    desaparecía y a 20px era una mancha. Aquí la figura y el sentido son la
    misma cosa —el contador redondo de la «a» ya tiene forma de rueda— así que
    no hay nada que se pueda perder al encoger.

    Tres piezas y ninguna suelta:
      · anillo blanco  = el neumático
      · disco de acento = el rin (el único color del sistema, con oficio)
      · asta            = el trazo que la vuelve una letra y no un círculo

    Se probó también con rayos en el rin: a tamaño grande se lee como MIRILLA
    y a 32px se hace lodo. El rin liso aguanta hasta 20px.
  -->
  <circle cx="239" cy="256" r="62" fill="#6E93E8" />
  <circle cx="239" cy="256" r="91" fill="none" stroke="#FFFFFF" stroke-width="58" />
  <rect x="335" y="136" width="58" height="240" fill="#FFFFFF" />
</svg>

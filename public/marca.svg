<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AutomotrizPro">
  <!--
    La marca: una «a» de caja baja cuyo bombo es una LLANTA, vista de frente.
    La llanta se dibuja con dos anillos concéntricos —flanco y rin—, que es
    como se ve una llanta de verdad de frente.

    NO lleva dientes de rodamiento, y eso fue una decisión con evidencia:
    un círculo con picos radiales se lee como ENGRANAJE, no como llanta. En una
    interfaz eso además ya significa otra cosa —«Configuración»— así que el
    icono de la app diría «Ajustes». Se probaron 30 dientes finos y 14 gruesos;
    ambos se hacen pelusa a 32px y ninguno se leía como letra.

    El asta va PEGADA al bombo. Separada, el ojo ve «rueda + barra»; pegada,
    ve una «a». Es la diferencia entre un símbolo y un monograma.

    Monocroma a propósito: en este sistema el azul significa «aquí estás» y
    «esto se puede tocar». Un logotipo no es ninguna de las dos.
  -->
  <g fill="#FFFFFF" fill-rule="evenodd">
    <path d="M114 256 a118 118 0 1 0 236 0 a118 118 0 1 0 -236 0 M146 256 a86 86 0 1 0 172 0 a86 86 0 1 0 -172 0"/>
    <path d="M170 256 a62 62 0 1 0 124 0 a62 62 0 1 0 -124 0 M188 256 a44 44 0 1 0 88 0 a44 44 0 1 0 -88 0"/>
    <rect x="306" y="138" width="58" height="236" rx="6"/>
  </g>
</svg>
